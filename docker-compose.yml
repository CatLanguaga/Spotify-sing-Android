# Single-container deploy: FastAPI serves the built React SPA at "/" and the API
# at "/api" on port 8000. Coolify can consume this file directly, or you can point
# Coolify at the Dockerfile and set env vars in its UI instead.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spotify-sync:latest
    restart: unless-stopped
    # Coolify's reverse proxy (Traefik) routes the FQDN to this port — do NOT
    # publish to the host (`ports:`) or it collides with the proxy on :8000.
    expose:
      - "8000"
    environment:
      # Spotify credentials. Optional — if omitted, the admin sets them once
      # via /settings and they persist in /app/data/config.json (volume-backed),
      # surviving redeploys without re-entry.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      DOWNLOAD_DIR: /app/downloads
      SPOTIFY_QUEUE_FILE: /app/data/queue.json
      SPOTIFY_CONFIG_DIR: /app/data
      ADMIN_DB_PATH: /app/data/admin.sqlite3
      MAX_TRACKS_PER_REQUEST: ${MAX_TRACKS_PER_REQUEST:-50}
      SPOTIFY_MAX_CONCURRENT_DOWNLOADS: ${SPOTIFY_MAX_CONCURRENT_DOWNLOADS:-3}
      # Round 1/2 admin hardening — leave ADMIN_PASSWORD blank after first boot
      # (DB seeded once; env then ignored). Rotate via admin_cli reset-password.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-1}
      SECURITY_HEADERS_STRICT: ${SECURITY_HEADERS_STRICT:-1}
      FORCE_HTTPS: ${FORCE_HTTPS:-1}
      ADMIN_META_PEPPER: ${ADMIN_META_PEPPER:-}
      # Round 3 — at-rest encryption + stealth. ADMIN_DATA_KEY auto-gens to
      # /app/data/.data_key on first boot if absent (volume-persistent).
      ADMIN_DATA_KEY: ${ADMIN_DATA_KEY:-}
      ADMIN_STEALTH: ${ADMIN_STEALTH:-}
      ADMIN_FOOTER_LINK: ${ADMIN_FOOTER_LINK:-true}
    volumes:
      - downloads:/app/downloads
      - data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  downloads:
  data:
