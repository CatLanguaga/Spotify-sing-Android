<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom input styles to match the utilitarian dark theme */
        input[type="text"], input[type="password"], input[type="number"], select {
            background-color: theme('colors.lifted-slate');
            border: 1px solid theme('colors.hairline-gray');
            color: theme('colors.on-surface');
            outline: none;
            transition: border-color 0.2s ease;
        }
        
        input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus, select:focus {
            border-color: rgba(29, 185, 84, 0.5); /* Spotify Green with opacity */
            box-shadow: none;
        }

        /* Custom range slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: theme('colors.pure-white');
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: theme('colors.hairline-gray');
            border-radius: 2px;
        }
        input[type=range].green-slider::-webkit-slider-runnable-track {
            background: linear-gradient(to right, theme('colors.primary-container') 85%, theme('colors.hairline-gray') 85%);
        }
        input[type=range].orange-slider::-webkit-slider-runnable-track {
            background: linear-gradient(to right, #F59B23 40%, theme('colors.hairline-gray') 40%);
        }

        /* Custom Checkbox */
        input[type="checkbox"] {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 16px;
            height: 16px;
            border: 1px solid theme('colors.silver-secondary');
            border-radius: 2px;
            display: grid;
            place-content: center;
        }
        input[type="checkbox"]::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em theme('colors.primary-container');
            background-color: theme('colors.primary-container');
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        input[type="checkbox"]:checked {
            border-color: theme('colors.primary-container');
        }
        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.hairline-gray');
            border-radius: 4px;
        }
    </style>
